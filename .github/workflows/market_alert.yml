name: Market Summary Alert

on:
  schedule:
    - cron: '0 4 * * 1-5'    # IST 9:30 AM
    - cron: '30 9 * * 1-5'   # IST 3:00 PM
    - cron: '0 10 * * 1-5'   # IST 3:30 PM
    - cron: '30 10 * * 1-5'  # IST 4:00 PM
  workflow_dispatch:

jobs:
  run-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set timezone to IST
        run: |
          sudo timedatectl set-timezone Asia/Kolkata
          echo "IST Time: $(date '+%d-%b-%Y | %I:%M %p')"
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests yfinance certifi pytz
      
      - name: Run Morning Alert
        if: ${{ github.event.schedule == '0 4 * * 1-5' || github.event.schedule == '30 9 * * 1-5' }}
        env:
          TZ: 'Asia/Kolkata'
        run: python Mkt_summary_alert.py morning
      
      - name: Run Evening Alert
        if: ${{ github.event.schedule == '0 10 * * 1-5' || github.event.schedule == '30 10 * * 1-5' }}
        env:
          TZ: 'Asia/Kolkata'
        run: python Mkt_summary_alert.py evening
