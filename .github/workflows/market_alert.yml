name: Market Summary Alert

on:
  schedule:
    # IST 10:30 AM = UTC 5:00 AM (Morning Alert)
    - cron: '0 5 * * 1-5'
    # IST 4:00 PM = UTC 10:30 AM (Evening Alert)
    - cron: '30 10 * * 1-5'
  
  # Manual trigger for testing
  workflow_dispatch:

jobs:
  run-alert:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests yfinance certifi pytz
      
      - name: Run Morning Alert (10:30 AM IST)
        if: github.event.schedule == '0 5 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: |
          echo "🚀 Morning Alert at 10:30 AM IST"
          python Mkt_summary_alert.py morning
      
      - name: Run Evening Alert (4:00 PM IST)
        if: github.event.schedule == '30 10 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: |
          echo "🚀 Evening Alert at 4:00 PM IST"
          python Mkt_summary_alert.py evening
