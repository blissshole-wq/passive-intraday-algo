name: Market Summary Alert

on:
  schedule:
    - cron: '0 4 * * 1-5'
    - cron: '30 9 * * 1-5'
    - cron: '0 10 * * 1-5'
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

jobs:
  run-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set timezone to IST
        run: |
          sudo timedatectl set-timezone Asia/Kolkata
          echo "IST_TIME=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests yfinance certifi pytz
      
      - name: Run Market Alert
        env:
          SUMMARY_BOT_TOKEN: ${{ secrets.SUMMARY_BOT_TOKEN }}
          SUMMARY_CHAT_ID: ${{ secrets.SUMMARY_CHAT_ID }}
        run: |
          export TZ='Asia/Kolkata'
          echo "Current IST: $(date '+%d-%b-%Y | %I:%M %p')"
          python Mkt_summary_alert.py
