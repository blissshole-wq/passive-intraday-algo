name: Daily Confluence Scanner

on:
  schedule:
    - cron: '30 10 * * 1-5' # தினமும் மாலை 4:00 PM IST
  workflow_dispatch: # மேனுவலா டெஸ்ட் பண்ண இது உதவும்

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Requirements
        run: pip install -r requirements.txt
        
      - name: Run Scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python scanner.py
