name: Summary Alert

on:
  schedule:
    - cron: '0 5 * * 1-5'
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

jobs:
  run-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests yfinance
      - name: Debug Files
        run: |
          ls -la
      - name: Morning Alert
        if: github.event.schedule == '0 5 * * 1-5' || github.event_name == 'workflow_dispatch'
        env:
          SUMMARY_BOT_TOKEN: ${{ secrets.SUMMARY_BOT_TOKEN }}
          SUMMARY_CHAT_ID: ${{ secrets.SUMMARY_CHAT_ID }}
        run: python Mkt_summary_alert.py morning
      - name: Evening Alert
        if: github.event.schedule == '30 10 * * 1-5'
        env:
          SUMMARY_BOT_TOKEN: ${{ secrets.SUMMARY_BOT_TOKEN }}
          SUMMARY_CHAT_ID: ${{ secrets.SUMMARY_CHAT_ID }}
        run: python Mkt_summary_alert.py evening
